<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spotter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font: 13px/18px "Tableau Book", Tableau, Arial, sans-serif; color: #333; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #e0e0e0; }
    header strong { font-size: 14px; }
    #subject { color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #close { all: unset; cursor: pointer; font-size: 18px; line-height: 1; color: #666; padding: 2px 6px; }
    .status { padding: 8px 12px; color: #666; }
    .status.error { color: #b3261e; }
    .status a { color: #1f77b4; }
    #spotter { flex: 1; min-height: 0; }
    #spotter iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <header>
    <strong>Spotter</strong>
    <span id="subject"></span>
    <button id="close" type="button" aria-label="Close Spotter">&times;</button>
  </header>
  <div id="status" class="status" hidden></div>
  <div class="status"><a id="open-options" href="#">Extension options</a></div>
  <div id="spotter"></div>
  <script src="dist/panel.js"></script>
</body>
</html>
